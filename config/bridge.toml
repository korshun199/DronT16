# Настройки первого моста Raspberry между CRSF-приёмником и Betaflight.
[bridge]
# UART Raspberry Pi 5: pin 10 RXD0 принимает, pin 8 TXD0 передаёт.
serial_port = "/dev/ttyAMA0"
# Скорость CRSF приёмника и UART1 полётного контроллера.
baudrate = 420000
# Передавать только проверенные кадры каналов RC.
forward_frame_type = 22
# Остановить передачу после такого таймаута без корректного RC-кадра.
link_timeout_ms = 300
# Период диагностической строки моста.
report_period_ms = 500
# Подробный вывод каждого RC-кадра; false — компактный рабочий журнал.
verbose_frames = false
# Показывать SENSOR в терминале; записи в simulator_filesafe.log сохраняются.
sensor_terminal = false
# Файл команд режима для видеомодуля.
control_file = "/tmp/dront16_command"
# Файл событий тумблера для автономного симулятора failsafe.
simulator_control_file = "/tmp/simulator_filesafe_command"
# Общий append-only журнал моста и симулятора.
log_file = "simulator_filesafe.log"

[msp]
# Канал чтения датчиков Betaflight; включён для текущей проверки MSP.
enabled = true
# UART1 Raspberry Pi 5 на GPIO0/1: pin 27 TX, pin 28 RX; не CRSF /dev/ttyAMA0.
serial_port = "/dev/ttyAMA1"
# Скорость MSP UART полётного контроллера.
baudrate = 115200
# Период циклического запроса ATTITUDE и ALTITUDE.
request_period_ms = 50
# Максимальный возраст показаний до перехода посадочного автомата в FAULT.
sensor_max_age_ms = 250

[landing]
# Посадочный контроллер выключен до повторного безопасного теста.
enabled = false
# Каналы CRSF: roll CH1, pitch CH2, throttle CH3.
roll_channel = 1
pitch_channel = 2
throttle_channel = 3
# Центр и границы RC-значений CRSF текущего приёмника.
rc_center = 992
rc_min = 191
rc_max = 1792
# Целевое горизонтальное положение корпуса.
target_roll_deg = 0.0
target_pitch_deg = 0.0
# Поправка RC на один градус ошибки наклона.
correction_per_degree = 18.0
# Максимальная поправка относительно центра RC.
max_correction = 250
# Время выравнивания до начала плавного снижения газа.
descent_start_after_s = 2.0
# Скорость снижения команды газа в единицах CRSF за секунду.
# Raspberry плавно снижает газ только в режиме LINK_LOST; меньше = медленнее.
throttle_step_per_s = 40.0
# Минимальный газ; при его достижении моторы не отключаются автоматически.
throttle_min = 191
# Высота и варио для тестового определения посадки по одному барометру.
landed_altitude_m = 0.30
landed_vario_abs_m_s = 0.15
landed_hold_s = 1.5
# Действие при потере MSP: HOLD оставляет последний безопасный газ.
fault_action = "HOLD"
# Канал DISARM для аварийного кадра посадочного автомата.
disarm_channel = 5
# Значение CH5 для DISARM на текущем приёмнике.
disarm_value = 191
# Канал режима ANGLE/HORIZON; 0 — режим не переключать автоматически.
stabilization_channel = 0
# Значение AUX, соответствующее заранее настроенному ANGLE/HORIZON.
stabilization_value = 1500
# Допустимое отклонение крена от горизонтали перед снижением.
level_roll_tolerance_deg = 5.0
# Допустимое отклонение тангажа от горизонтали перед снижением.
level_pitch_tolerance_deg = 5.0
# Сколько секунд дрон должен оставаться выровненным перед снижением.
level_hold_s = 1.0
