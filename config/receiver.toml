# Настройки первого модуля проверки связи Raspberry с CRSF-приёмником.
[receiver]
# UART0 Raspberry Pi 5 на физических pin 8/10 после dtoverlay=uart0-pi5.
# /dev/serial0 на Pi 5 может указывать на отдельный debug-UART10.
serial_port = "/dev/ttyAMA0"
# Скорость CRSF ELRS/приёмника в бодах.
baudrate = 420000
# Таймаут отсутствия пакетов до сообщения о потере связи в миллисекундах.
link_timeout_ms = 300
# Номер AUX-канала для будущего тумблера DronT16.
# AUX2 соответствует физическому каналу CH6.
mode_channel = 6
# Период печати сводки в миллисекундах.
report_period_ms = 250

[mode]
# Верхняя граница нижнего положения AUX2: свободный режим.
low_max = 700
# Нижняя граница верхнего положения AUX2: сопровождение объекта.
high_min = 1700
# Сколько одинаковых кадров нужно для подтверждения переключения.
debounce_frames = 3
