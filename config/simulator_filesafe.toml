# Настройки автономного симулятора потери связи.
[simulator]
# Общая длительность сценария в секундах; 0 — работать до остановки run/systemd.
duration_s = 0.0
# Шаг виртуального времени симулятора в миллисекундах.
step_ms = 100
# Период подробного пакета телеметрии в миллисекундах.
packet_period_ms = 500
# Имя файла полного текстового журнала.
log_file = "simulator_filesafe.log"

[flight_controller]
# Модель полётника для отображения в журнале.
name = "Betaflight HAKRCF405V2"
# Виртуальный входной порт CRSF.
crsf_port = "/simulated/ttyAMA0"
# Виртуальный выход команд MSP.
msp_port = "/simulated/uart1"
# Скорость виртуального порта полётника.
baudrate = 420000
# Начальный курс в градусах.
heading_deg = 184.6
# Начальная высота в метрах.
altitude_m = 38.2
# Начальная скорость в метрах в секунду.
speed_m_s = 12.7

[object]
# Идентификатор объекта, выбранного пилотом.
object_id = "TARGET_001"
# Начальные координаты рамки объекта в пикселях.
x = 412.0
y = 238.0
width = 86.0
height = 74.0
# Начальная оценка удержания объекта.
confidence = 0.87

[failsafe]
# Разворот при потере связи в градусах.
turn_degrees = 180.0
# Скорость виртуального разворота в градусах в секунду.
turn_rate_deg_s = 60.0
# Использовать последние подтверждённые данные полётника.
use_last_packet = true

[control]
# Канал тумблера моделирования потери связи; CH7 = AUX3.
loss_channel = 7
# Нижнее положение тумблера считается нормальной связью.
link_ok_max = 700
# Верхнее положение тумблера считается потерей связи.
link_lost_min = 1700
# Канал команды ARM/DISARM Betaflight; по умолчанию CH5 = AUX1.
disarm_channel = 5
# Низкое raw-значение канала означает немедленный DISARM.
# На данном передатчике высокий уровень CH5 соответствует ARM.
disarm_active_max = 700
# Верхнее raw-значение CH5 подтверждает ARM и разрешает takeover.
arm_active_min = 1700
# Канал газа CRSF; CH3 — throttle.
throttle_channel = 3
# Минимальное значение газа CRSF; для текущего приёмника это примерно 0%.
throttle_zero = 191
# Время плавного сброса газа от сохранённого значения до throttle_zero.
throttle_ramp_s = 5.0
# Файл команд от CRSF-моста; реальные порты не используются.
command_file = "/tmp/simulator_filesafe_command"
