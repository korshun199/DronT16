# Параметры экранного OSD и центральной области захвата.
[osd]
# Размер центрального квадрата захвата в пикселях.
capture_box_size = 53
# Длина плеча центрального перекрестия в пикселях.
crosshair_arm = 8
# Толщина рамок OSD в пикселях.
line_thickness = 2
# Радиус центральной точки цели в пикселях.
target_point_radius = 4
# Масштаб подписи режима OpenCV.
mode_font_scale = 0.8
# Толщина подписи режима OpenCV.
mode_font_thickness = 2
# Масштаб нижней строки состояния OpenCV.
message_font_scale = 0.55
# Толщина нижней строки состояния OpenCV.
message_font_thickness = 2
