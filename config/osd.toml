# Параметры экранного OSD и центральной области захвата.
[osd]
# Размер центрального квадрата захвата в пикселях.
capture_box_size = 53
# Длина плеча центрального перекрестия в пикселях.
crosshair_arm = 8
# Толщина рамок OSD в пикселях.
line_thickness = 2
# Радиус центральной точки цели в пикселях.
target_point_radius = 4
# Масштаб подписи режима OpenCV.
mode_font_scale = 0.8
# Толщина подписи режима OpenCV.
mode_font_thickness = 2
# Масштаб нижней строки состояния OpenCV.
message_font_scale = 0.55
# Толщина нижней строки состояния OpenCV.
message_font_thickness = 2
# Координата X подписи режима от левого края.
mode_x = 20
# Координата Y подписи режима от верхнего края.
mode_y = 32
# Положение центра рамки и перекрестия по горизонтали в процентах.
center_x_percent = 50.0
# Положение центра рамки и перекрестия по вертикали в процентах.
center_y_percent = 50.0
# Ручное смещение центра рамки и перекрестия по горизонтали в пикселях.
center_offset_x = -10
# Ручное смещение центра рамки и перекрестия по вертикали в пикселях.
center_offset_y = -10
# Отдельное смещение центра квадрата захвата по горизонтали в пикселях.
capture_box_offset_x = 12
# Отдельное смещение центра квадрата захвата по вертикали в пикселях.
capture_box_offset_y = 12

# Цвета режимов в формате HEX #RRGGBB.
[osd.colors]
# Цвет свободного режима.
idle = "#f6efe8"
# Цвет режима захвата.
capture = "#e3c70b"
# Цвет режима сопровождения.
tracking = "#ff0000"
# Цвет потерянной цели.
lost = "#dc14ff"
# Цвет отключённого режима.
disabled = "#ff0000"
# Цвет режима возврата.
return = "#ff8c00"

# Геометрия всего изображения перед передачей на J7.
[osd.output]
# Единый видеостандарт аналогового тракта FC/EasyCap/J7.
# NTSC соответствует входу EasyCap 720x480; J7 будет принудительно выбран
# в режиме 720x480i, а не в первом случайном режиме списка DRM.
video_standard = "NTSC"
# Режим заполнения выхода без чёрных полей.
fit = "stretch"
# Масштаб всего изображения по горизонтали.
scale_x = 1.0
# Масштаб всего изображения по вертикали.
scale_y = 1.0
# Смещение всего изображения по горизонтали в пикселях.
offset_x = 0
# Смещение всего изображения по вертикали в пикселях.
offset_y = 0
