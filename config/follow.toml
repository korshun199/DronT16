# Параметры проекции собственной камеры Raspberry Pi или USB-камеры ноутбука.
[camera]
# Горизонтальный угол обзора камеры в градусах.
horizontal_fov_deg = 90.0
# Вертикальный угол обзора камеры в градусах.
vertical_fov_deg = 60.0
# Процент положения опорного центра по горизонтали.
center_x_percent = 50.0
# Процент положения опорного центра по вертикали.
center_y_percent = 50.0

# Ограничения расчёта направления и период вывода координат.
[guidance]
# Мёртвая зона по рысканию в градусах.
yaw_deadband_deg = 2.0
# Мёртвая зона по тангажу в градусах.
pitch_deadband_deg = 2.0
# Максимальная расчётная скорость коррекции рыскания.
max_yaw_rate_deg_s = 30.0
# Максимальная расчётная скорость коррекции тангажа.
max_pitch_rate_deg_s = 15.0
# Период вывода координат в терминал в миллисекундах.
report_period_ms = 250

# Параметры сменного адаптера Betaflight MSP.
[msp]
# Реальная отправка запрещена до отдельного разрешения и стендовой проверки.
enabled = false
# Безопасный режим подготовки команд без открытия UART.
transport = "dry-run"
# Будущий последовательный порт полётного контроллера.
serial_port = "/dev/ttyAMA0"
# Будущая скорость последовательного порта.
baudrate = 115200

# Алгоритм движения ранее захваченной области.
[tracker]
# Алгоритм движения рамки после команды «Захватить».
# csrt — самый устойчивый к изменению масштаба, повороту и сложному фону;
# рекомендуется для рабочего режима Raspberry Pi 5.
algorithm = "csrt"
# kcf — быстрее CSRT, но хуже переносит резкую смену масштаба и перекрытия.
# algorithm = "kcf"
# mil — простой и нетребовательный, но чаще теряет цель при движении.
# algorithm = "mil"

# Проверка, что трекер сохраняет именно выбранную пилотом цель.
[verification]
# Включение проверки образца объекта после захвата.
enabled = true
# Способ отличать выбранный объект от изменяющегося фона.
# foreground — выделяет переднюю область маской GrabCut и подавляет фон;
# это основной рекомендуемый режим для испытаний.
method = "adaptive"
# appearance — сравнивает объект с первоначальным образцом;
# надёжен при неизменном фоне, но может потерять цель при смене фона.
# method = "appearance"
# adaptive — постепенно обновляет образец после уверенного совпадения;
# устойчив к плавной смене внешнего вида, но требует осторожного порога.
# method = "adaptive"
# disabled — отключает проверку сходства и оставляет только трекер;
# использовать для диагностики, риск ложного удержания выше.
# method = "disabled"

# Минимальное сходство найденной области с образцом от 0.0 до 1.0.
# Меньше значение — устойчивее к изменению фона, но выше риск захвата похожей области.
min_similarity = 0.3
# Сколько подряд слабых кадров разрешено до объявления потери цели.
# Увеличение помогает при кратковременном перекрытии, но задерживает фиксацию потери.
max_bad_frames = 16
# Скорость адаптации образца в режиме adaptive: 0 — не менять, 1 — заменить сразу.
adaptation_rate = 0.05
# Полоса по краям области, считаемая вероятным фоном, в процентах.
# Больше значение сильнее убирает фон, но может обрезать край небольшого объекта.
foreground_margin_percent = 15.0
