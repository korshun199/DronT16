# Параметры проекции собственной камеры Raspberry Pi или USB-камеры ноутбука.
[camera]
# Горизонтальный угол обзора камеры в градусах.
horizontal_fov_deg = 90.0
# Вертикальный угол обзора камеры в градусах.
vertical_fov_deg = 60.0
# Процент положения опорного центра по горизонтали.
center_x_percent = 50.0
# Процент положения опорного центра по вертикали.
center_y_percent = 50.0

# Ограничения расчёта направления и период вывода координат.
[guidance]
# Мёртвая зона по рысканию в градусах.
yaw_deadband_deg = 2.0
# Мёртвая зона по тангажу в градусах.
pitch_deadband_deg = 2.0
# Максимальная расчётная скорость коррекции рыскания.
max_yaw_rate_deg_s = 30.0
# Максимальная расчётная скорость коррекции тангажа.
max_pitch_rate_deg_s = 15.0
# Период вывода координат в терминал в миллисекундах.
report_period_ms = 250

# Параметры сменного адаптера Betaflight MSP.
[msp]
# Реальная отправка запрещена до отдельного разрешения и стендовой проверки.
enabled = false
# Безопасный режим подготовки команд без открытия UART.
transport = "dry-run"
# Будущий последовательный порт полётного контроллера.
serial_port = "/dev/ttyAMA0"
# Будущая скорость последовательного порта.
baudrate = 115200
